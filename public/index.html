<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAXA AI</title>
<style>
  *{margin:0; padding:0; box-sizing:border-box; font-family: Segoe UI, Arial, sans-serif;}
  body{display:flex; height:100vh; background:white; color:#171717; overflow:hidden;}

  /* Left Side - ChatGPT jaisi kali patti */
  .sidebar{width:260px; background:#171717; color:white; display:flex; flex-direction:column; padding:14px; flex-shrink:0;}
  .sidebar .logo{font-size:20px; font-weight:bold; padding:8px;}
  .new-chat{background:transparent; border:1px solid #555; color:white; padding:11px; border-radius:12px; cursor:pointer; margin:12px 0; text-align:left; font-size:15px;}
  .new-chat:hover{background:#2a2a2a;}
  .history{flex:1; overflow-y:auto; font-size:14px; color:#d1d1d1;}
  .history div{padding:10px; border-radius:8px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .history div:hover{background:#2a2a2a;}
  .side-bottom{border-top:1px solid #333; padding-top:12px;}
  .side-bottom button{background:none; border:none; color:white; width:100%; text-align:left; padding:10px; border-radius:8px; cursor:pointer; font-size:14px;}
  .side-bottom button:hover{background:#2a2a2a;}
  .user-box{display:flex; align-items:center; gap:10px; padding:10px; margin-top:8px;}
  .user-box .dp{width:32px; height:32px; background:#10a37f; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; flex-shrink:0;}

  /* Right Side - Main ChatGPT jaisa */
  .main{flex:1; display:flex; flex-direction:column; background:white; min-width:0;}
  .topbar{padding:16px 20px; font-weight:600; font-size:18px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f0f0f0;}
  #chat{flex:1; overflow-y:auto; padding:20px; max-width:800px; width:100%; margin:0 auto;}
  .welcome{text-align:center; margin-top:110px; font-size:32px; font-weight:600;}
  .welcome small{display:block; font-size:15px; font-weight:normal; color:#777; margin-top:10px;}

  /* User aur AI ke messages - ChatGPT style */
  .msg{padding:12px 0; display:flex; gap:12px; line-height:1.6; font-size:16px;}
  .msg b{font-size:14px;}
  .msg .bubble{flex:1;}
  .msg.user .bubble{background:#f4f4f4; padding:12px 16px; border-radius:18px; width:fit-content; max-width:90%;}

  /* Neeche wala ChatGPT jaisa dabba */
  .composer-wrap{max-width:800px; width:100%; margin:0 auto; padding:12px 15px 5px 15px;}
  .composer{background:#f4f4f4; border-radius:28px; padding:10px 12px; display:flex; align-items:flex-end; gap:6px;}
  .composer textarea{flex:1; border:none; outline:none; background:transparent; resize:none; font-size:16px; padding:8px; min-height:24px; color:black; max-height:120px;}
  .icon-btn{width:36px; height:36px; border:none; background:transparent; font-size:20px; cursor:pointer; border-radius:50%; flex-shrink:0;}
  .send-btn{width:36px; height:36px; border-radius:50%; background:#171717; color:white; border:none; font-size:18px; cursor:pointer; flex-shrink:0; display:none;}
  .status{text-align:center; font-size:12px; color:#999; padding-bottom:12px;}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">NAXA AI</div>
  <button class="new-chat" onclick="location.reload()">+ New chat</button>
  <div class="history">
    <div>Aaj wali chat</div>
    <div>Kal wali chat</div>
    <div>NAXA AI ke bare me</div>
  </div>
  <div class="side-bottom">
    <button id="imageBtn">🖼️ Image</button>
    <button onclick="logout()">Logout</button>
    <div class="user-box">
      <div class="dp" id="userName">N</div>
      <div><div id="userEmail" style="font-size:14px;">User</div><div style="font-size:12px; color:#aaa;">Free Plan</div></div>
    </div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <span>NAXA AI</span>
    <span style="font-size:14px; font-weight:normal; border:1px solid #ddd; padding:6px 12px; border-radius:20px; cursor:pointer;">Share</span>
  </div>

  <div id="chat">
    <div class="welcome">What can I help with?<small>Ask anything, NAXA AI is here to help</small></div>
  </div>

<!-- PLUS WALA MENU - YAHAN PASTE KARO -->
<div id="plusMenu" style="display:none; background:white; border:1px solid #ddd; border-radius:14px; padding:10px; margin:0 10px 8px 10px; box-shadow:0 4px 20px rgba(0,0,0,0.15); flex-direction:column; gap:5px;">
  <button onclick="openPhotoEdit()" style="text-align:left; padding:10px; border:none; background:#f5f5f5; border-radius:10px; cursor:pointer; font-size:15px;">📸 Photo Edit Karo</button>
  <button onclick="openCamera()" style="text-align:left; padding:10px; border:none; background:#f5f5f5; border-radius:10px; cursor:pointer; font-size:15px;">📷 Camera On Karo</button>
  <button onclick="openPdf()" style="text-align:left; padding:10px; border:none; background:#f5f5f5; border-radius:10px; cursor:pointer; font-size:15px;">📄 PDF Banao</button>
  <button onclick="openNewFile()" style="text-align:left; padding:10px; border:none; background:#f5f5f5; border-radius:10px; cursor:pointer; font-size:15px;">📁 New File Banao</button>
</div>

<!-- CHUPE HUE INPUTS -->
<input type="file" id="photoInput" accept="image/*" style="display:none;">
<input type="file" id="pdfInput" accept="image/*,.pdf,.txt,.docx" style="display:none;">
  <div class="composer-wrap">
    <div class="composer">
      <button class="icon-btn" id="filesBtn">+</button>
      <textarea id="input" placeholder="Ask anything"></textarea>
      <button class="icon-btn" id="mic">🎤</button>
      <button class="send-btn" id="send">↑</button>
    </div>
  </div>
  <div class="status">NAXA AI can make mistakes. Check important info.</div>
</div>

<input id="files" type="file" multiple accept=".pdf,.txt,.docx,.jpg,.png" style="display:none">
<input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none">

<script>
let chatBox = document.getElementById('chat');
let inputBox = document.getElementById('input');
let micBtn = document.getElementById('mic');
let sendBtn = document.getElementById('send');

function logout(){
  localStorage.removeItem('naxa_user');
  location.reload();
}

// ChatGPT jaisa - likhne par mic gayab, send aayega
inputBox.addEventListener('input', function(){
  inputBox.style.height = 'auto';
  inputBox.style.height = inputBox.scrollHeight + 'px';
  if(inputBox.value.trim() === ""){
    micBtn.style.display = 'block';
    sendBtn.style.display = 'none';
  } else {
    micBtn.style.display = 'none';
    sendBtn.style.display = 'block';
  }
});

document.getElementById('filesBtn').addEventListener('click', function(){
  document.getElementById('files').click();
});

document.getElementById('imageBtn').addEventListener('click', function(){
  document.getElementById('cameraInput').click();
});

micBtn.addEventListener('click', function(){
  alert('Mic dab gaya! Ab yahan voice recording lagayenge');
});

// Enter se send
inputBox.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage(){
  let text = inputBox.value.trim();
  if(!text) return;
  // Welcome hatado pehli dafa
  let welcome = document.querySelector('.welcome');
  if(welcome) welcome.remove();

  chatBox.innerHTML += '<div class="msg user"><div class="bubble">'+text+'</div></div>';
  inputBox.value = '';
  inputBox.style.height = 'auto';
  micBtn.style.display = 'block';
  sendBtn.style.display = 'none';
  chatBox.scrollTop = chatBox.scrollHeight;

// Asli wala - ab server / Gemini ko jayega
try {
  let res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ messages: [{ role: "user", content: text }] })
  });
  let data = await res.json();
  let reply = data.reply || "Server se jawab nahi aaya";
  chatBox.innerHTML += '<div class="msg"><b>NAXA</b><div class="bubble">' + reply + '</div></div>';
  chatBox.scrollTop = chatBox.scrollHeight;
} catch(e) {
  chatBox.innerHTML += '<div class="msg"><b>NAXA</b><div class="bubble">Server se connect nahi ho raha, server restart karo.</div></div>';
}
}
sendBtn.addEventListener('click', sendMessage);

// Login yaad rakhne wala
window.addEventListener('load', function(){
  let saved = localStorage.getItem('naxa_user');
  if(saved){
    let emailBox = document.getElementById('userEmail');
    if(emailBox) emailBox.innerText = saved;
    let nameBox = document.getElementById('userName');
    if(nameBox) nameBox.innerText = saved.charAt(0).toUpperCase();
  }
});
// PLUS BUTTON KA KAAM
let filesBtn = document.getElementById('filesBtn');
let plusMenu = document.getElementById('plusMenu');

filesBtn.onclick = function(){
  if(plusMenu.style.display === "none" || plusMenu.style.display === ""){
    plusMenu.style.display = "flex";
  } else {
    plusMenu.style.display = "none";
  }
};

function openPhotoEdit(){
  plusMenu.style.display = "none";
  document.getElementById('photoInput').click();
}
function openCamera(){
  plusMenu.style.display = "none";
  document.getElementById('cameraInput').click();
}
function openPdf(){
  plusMenu.style.display = "none";
  document.getElementById('pdfInput').click();
}
function openNewFile(){
  plusMenu.style.display = "none";
  alert("New File wala option abhi bana rahe hain bhai!");
}

// PHOTO SELECT HOTE HI EDIT HO
document.getElementById('photoInput').onchange = async function(){
  const file = this.files[0];
  if(!file) return;
  const filter = prompt("Filter likho: 1=Best, 2=Black & White, 3=Blur, 4=Roshan, 5=Vintage", "1");
  const form = new FormData();
  form.append("photo", file);
  form.append("filter", filter);
  const res = await fetch("/api/edit-photo", { method: "POST", body: form });
  const data = await res.json();
  if(data.editedPhoto){
    let img = document.createElement("img");
    img.src = data.editedPhoto;
    img.style.maxWidth = "90%";
    img.style.margin = "10px";
    img.style.borderRadius = "12px";
    document.getElementById('chat').appendChild(img);
  } else {
    alert("Masla aa gaya");
  }
};
</script>
</body>
</html>
